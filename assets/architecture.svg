<svg width="820" height="600" viewBox="0 0 820 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="820" height="600" rx="16" fill="#faf9f5"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="20" font-weight="600" fill="#26215c">kvfit — architecture</text>
  <text x="40" y="66" font-size="13" fill="#5f5e5a">One command in, a plain-language verdict out. Purple = zero-dependency core.</text>

  <!-- Entry points -->
  <text x="40" y="104" font-size="12" fill="#888780">How people use it</text>
  <g>
    <rect x="40" y="114" width="220" height="52" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/>
    <text x="150" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">CLI</text>
    <text x="150" y="157" text-anchor="middle" font-size="12" fill="#5f5e5a">one command</text>
  </g>
  <g>
    <rect x="300" y="114" width="220" height="52" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/>
    <text x="410" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">Python API</text>
    <text x="410" y="157" text-anchor="middle" font-size="12" fill="#5f5e5a">import in scripts &amp; notebooks</text>
  </g>
  <g>
    <rect x="560" y="114" width="220" height="52" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/>
    <text x="670" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#2c2c2a">CI/CD check</text>
    <text x="670" y="157" text-anchor="middle" font-size="12" fill="#5f5e5a">fail the build if it won't fit</text>
  </g>

  <line x1="150" y1="166" x2="330" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="410" y1="166" x2="410" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="670" y1="166" x2="490" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Core pipeline -->
  <g>
    <rect x="260" y="208" width="300" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75"/>
    <text x="410" y="234" text-anchor="middle" font-size="14" font-weight="600" fill="#3c3489">Model config resolver</text>
    <text x="410" y="251" text-anchor="middle" font-size="12" fill="#534ab7">reads layers, KV heads, dtype</text>
  </g>
  <line x1="410" y1="260" x2="410" y2="292" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>

  <g>
    <rect x="260" y="296" width="300" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75"/>
    <text x="410" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#3c3489">KV cache math engine</text>
    <text x="410" y="339" text-anchor="middle" font-size="12" fill="#534ab7">memory per token and total</text>
  </g>
  <g>
    <rect x="600" y="296" width="180" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.75"/>
    <text x="690" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">What-if sweep</text>
    <text x="690" y="339" text-anchor="middle" font-size="12" fill="#0f6e56">fp16 · fp8 · int4</text>
  </g>
  <line x1="600" y1="322" x2="562" y2="322" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="410" y1="348" x2="410" y2="380" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>

  <g>
    <rect x="260" y="384" width="300" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75"/>
    <text x="410" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#3c3489">Fit checker</text>
    <text x="410" y="427" text-anchor="middle" font-size="12" fill="#534ab7">vs GPU or CPU memory budget</text>
  </g>
  <g>
    <rect x="40" y="384" width="180" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.75" stroke-dasharray="5 4"/>
    <text x="130" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Measure mode</text>
    <text x="130" y="427" text-anchor="middle" font-size="12" fill="#0f6e56">optional · real GPU</text>
  </g>
  <line x1="220" y1="410" x2="258" y2="410" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <line x1="410" y1="436" x2="410" y2="468" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>

  <g>
    <rect x="260" y="472" width="300" height="52" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.75"/>
    <text x="410" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#3c3489">Reporter</text>
    <text x="410" y="515" text-anchor="middle" font-size="12" fill="#534ab7">verdict · table · plain-language tips</text>
  </g>

  <!-- Outputs -->
  <line x1="330" y1="524" x2="150" y2="556" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="380" y1="524" x2="360" y2="556" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="440" y1="524" x2="460" y2="556" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="490" y1="524" x2="670" y2="556" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>

  <g font-size="13" font-weight="600" fill="#2c2c2a">
    <rect x="60" y="560" width="160" height="34" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/>
    <text x="140" y="581" text-anchor="middle">Fits / OOM</text>
    <rect x="280" y="560" width="120" height="34" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/>
    <text x="340" y="581" text-anchor="middle">Memory split</text>
    <rect x="420" y="560" width="120" height="34" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/>
    <text x="480" y="581" text-anchor="middle">Cost estimate</text>
    <rect x="600" y="560" width="140" height="34" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/>
    <text x="670" y="581" text-anchor="middle">Fix suggestions</text>
  </g>
</svg>
