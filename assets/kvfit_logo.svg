<svg width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f5"/>
      <stop offset="1" stop-color="#f1eff9"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a60d6"/>
      <stop offset="1" stop-color="#534ab7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7f77dd"/>
      <stop offset="1" stop-color="#534ab7"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c3489"/>
      <stop offset="1" stop-color="#6a60d6"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="0" y="0" width="720" height="240" rx="24" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="718.5" height="238.5" rx="23.25" fill="none" stroke="#e2def5" stroke-width="1.5"/>

  <!-- ===== Icon: a memory "chip" whose KV bars grow to a fit line ===== -->
  <g transform="translate(56, 56)">
    <!-- chip body -->
    <rect x="0" y="0" width="128" height="128" rx="20" fill="url(#purple)"/>
    <!-- chip pins -->
    <g fill="#cecbf6">
      <rect x="16" y="-8" width="8" height="12" rx="2"/>
      <rect x="44" y="-8" width="8" height="12" rx="2"/>
      <rect x="76" y="-8" width="8" height="12" rx="2"/>
      <rect x="104" y="-8" width="8" height="12" rx="2"/>
      <rect x="16" y="124" width="8" height="12" rx="2"/>
      <rect x="44" y="124" width="8" height="12" rx="2"/>
      <rect x="76" y="124" width="8" height="12" rx="2"/>
      <rect x="104" y="124" width="8" height="12" rx="2"/>
    </g>
    <!-- inner well -->
    <rect x="18" y="18" width="92" height="92" rx="10" fill="#3c3489"/>
    <!-- the "fit" budget line -->
    <line x1="24" y1="34" x2="104" y2="34" stroke="#1d9e75" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>
    <!-- growing KV bars (rise toward, but stay under, the budget line) -->
    <g>
      <rect x="27"  y="86" width="12" height="18" rx="3" fill="url(#bar)"/>
      <rect x="45"  y="72" width="12" height="32" rx="3" fill="url(#bar)"/>
      <rect x="63"  y="58" width="12" height="46" rx="3" fill="url(#bar)"/>
      <rect x="81"  y="44" width="12" height="60" rx="3" fill="#7f77dd"/>
    </g>
    <!-- fit check -->
    <g transform="translate(78, 66)">
      <circle cx="18" cy="18" r="19" fill="#1d9e75"/>
      <path d="M10 18.5 L15.5 24 L26 12" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="224" y="118" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#wordmark)">kvfit</text>
  <!-- tagline -->
  <text x="228" y="150" font-size="20" font-weight="600" fill="#534ab7">Will your LLM fit?</text>
  <text x="228" y="176" font-size="15.5" font-weight="500" fill="#6b6a7d">KV-cache &amp; GPU/CPU memory planner · zero dependencies</text>

  <!-- little formula chip -->
  <g transform="translate(228, 192)">
    <rect x="0" y="0" width="322" height="30" rx="8" fill="#eeedfe" stroke="#cecbf6" stroke-width="1"/>
    <text x="14" y="20" font-size="13.5" font-family="'SF Mono', ui-monospace, Menlo, monospace" fill="#3c3489">2 · layers · kv_heads · head_dim · bytes/token</text>
  </g>
</svg>
